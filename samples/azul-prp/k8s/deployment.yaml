apiVersion: apps/v1
kind: Deployment
metadata:
  name: heavy-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heavy-workload
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: heavy-workload
      annotations:
        prp.kedify.io/reconcile: enabled
    spec:
      containers:
        - name: main
          image: ghcr.io/holmistr/azul-app:main
          env:
            - name: REPETITIONS
              value: "180"
            - name: ADDITIONAL_JVM_ARGUMENTS
              value: ""
          # initial resources for the workload (lifted)
          resources:
            requests:
              cpu: 2
            limits:
              cpu: 2
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "/ready.py"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
