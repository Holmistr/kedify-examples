apiVersion: apps/v1
kind: Deployment
metadata:
  name: heavy-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heavy-workload
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: heavy-workload
      annotations:
        prp.kedify.io/reconcile: enabled
    spec:
      containers:
        - name: main
          image: ghcr.io/holmistr/azul-app:main
          env:
            - name: REPETITIONS
              value: "180"
            - name: ADDITIONAL_JVM_ARGUMENTS
              value: "-Xlog:gc:file=/gc.log -XX:CompilerWarmupPeriodSeconds=100000 -XX:CIMaxCompilerThreads=2 -XX:CompilerWarmupExtraThreads=6"
          # initial resources for the workload (lifted)
          resources:
            requests:
              cpu: 10
            limits:
              cpu: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  echo "[READINESS] running at $(date)" 1>&2
                  /ready.py 2>&1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
